<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Vibrant Emerald Leaf Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Golden Sunlight Accent Gradient -->
    <linearGradient id="sunGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Modern AI Neural Cyan Gradient -->
    <linearGradient id="aiTechGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <g filter="url(#logoGlow)" transform="translate(40, 20)">
    
    <!-- 1. Sleek Modern Emblem: Sprout & Digital Neural Growth -->
    <g transform="translate(20, 15)">
      <!-- Outer Shield / Circle Glow -->
      <circle cx="65" cy="65" r="62" fill="#064e3b" fill-opacity="0.85" stroke="url(#emeraldGrad)" stroke-width="3.5" />
      
      <!-- Golden Sun Arc Behind Plant -->
      <path d="M 35 65 A 30 30 0 0 1 95 65" fill="none" stroke="url(#sunGoldGrad)" stroke-width="3" stroke-dasharray="4,4" opacity="0.85" />

      <!-- Left Leaf (Organic Sprout) -->
      <path d="M 65,95 C 40,85 30,55 45,35 C 55,48 65,65 65,95 Z" fill="url(#emeraldGrad)" opacity="0.95" />
      
      <!-- Right Leaf (AI Tech Leaf with Node) -->
      <path d="M 65,95 C 90,85 100,55 85,35 C 75,48 65,65 65,95 Z" fill="url(#emeraldGrad)" />

      <!-- Central Stem & Circuit Line -->
      <path d="M 65,100 L 65,30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      
      <!-- Digital AI Node & Leaf Circuit -->
      <circle cx="65" cy="28" r="6" fill="url(#sunGoldGrad)" stroke="#ffffff" stroke-width="2" />
      <circle cx="82" cy="50" r="4" fill="#ffffff" />
      <circle cx="48" cy="50" r="4" fill="#ffffff" />
      <path d="M 65,60 L 82,50 M 65,60 L 48,50" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 2. Typography: AgriAI -->
    <!-- 'Agri' in Solid Pure White -->
    <text x="175" y="105" 
          font-family="system-ui, -apple-system, 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="88" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="#ffffff">
      Agri
    </text>

    <!-- 'AI' in Vibrant Tech Emerald Gradient -->
    <text x="390" y="105" 
          font-family="system-ui, -apple-system, 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="88" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="url(#aiTechGrad)">
      AI
    </text>

    <!-- 3. Clean Modern Subtitle Tagline Pill -->
    <g transform="translate(180, 130)">
      <!-- Pill Backdrop -->
      <rect x="0" y="0" width="410" height="28" rx="14" fill="#000000" fill-opacity="0.45" stroke="#10b981" stroke-width="1.2" />
      <!-- Golden Seed Sparkle -->
      <circle cx="16" cy="14" r="4" fill="url(#sunGoldGrad)" />
      <!-- Text -->
      <text x="30" y="19" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" 
            font-weight="700" 
            letter-spacing="2.5" 
            fill="#f8fafc"
            text-transform="uppercase">
        Smart Farm &amp; Market Platform
      </text>
    </g>

  </g>
</svg>
